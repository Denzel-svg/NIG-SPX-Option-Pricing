name: End-to-end SPX data pipeline and NIG calibration

on:
  workflow_dispatch:
  push:
    branches:
      - setup/project-structure
    paths:
      - "data/raw/SPX_options_data.xlsx"
      - "notebooks/01_Market_Data_Cleaning.ipynb"
      - "notebooks/01_Data_Validation.ipynb"
      - "scripts/run_data_pipeline.py"
      - "scripts/run_calibration.py"
      - "scripts/run_benchmark.py"
      - "scripts/run_numerical_diagnostics.py"
      - "scripts/plot_calibration_results.py"
      - "src/**"
      - "requirements.txt"
      - ".github/workflows/calibration.yml"

jobs:
  pipeline:
    # Do not run against an old CSV when the canonical workbook is absent.
    if: ${{ hashFiles('data/raw/SPX_options_data.xlsx') != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Execute cleaning, validation, calibration and diagnostics
        env:
          PYTHONPATH: .
          MPLBACKEND: Agg
        run: python scripts/run_data_pipeline.py
      - name: Upload executed notebooks, calibration results and figures
        uses: actions/upload-artifact@v4
        with:
          name: nig-end-to-end-pipeline
          path: |
            results/executed_notebooks/
            results/calibration/
            results/figures/
          if-no-files-found: error
