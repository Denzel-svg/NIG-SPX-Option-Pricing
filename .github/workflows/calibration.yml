name: Full-sample NIG calibration

on:
  workflow_dispatch:
  push:
    branches:
      - setup/project-structure
    paths:
      - "src/calibration.py"
      - "scripts/run_calibration.py"
      - "data/cleaned/calibration_candidates.csv.gz"
      - ".github/workflows/calibration.yml"

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run full-sample calibration
        env:
          PYTHONPATH: .
        run: python scripts/run_calibration.py
      - name: Run Black-Scholes benchmark and ARPE comparison
        env:
          PYTHONPATH: .
        run: python scripts/run_benchmark.py
      - name: Run residual and numerical stability diagnostics
        env:
          PYTHONPATH: .
        run: python scripts/run_numerical_diagnostics.py
      - name: Upload calibration diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: nig-calibration-diagnostics
          path: results/calibration/
          if-no-files-found: error
